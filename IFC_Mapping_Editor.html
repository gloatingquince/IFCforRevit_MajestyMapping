<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IFC Mapping Editor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f4f6;
    color: #202124;
}

button,
input,
select {
    font-family: inherit;
}

button {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #30343b;
    border-radius: 6px;

    height: 34px;
    padding: 0 12px;

    cursor: pointer;

    transition:
        background .15s,
        border-color .15s;
}

button:hover {
    background: #f3f4f6;
    border-color: #b8bec7;
}

button.primary {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
}

button.primary:hover {
    background: #1d4ed8;
}

input,
select {
    height: 34px;

    border: 1px solid #d1d5db;
    border-radius: 6px;

    background: #fff;

    padding: 0 9px;

    outline: none;

    font-size: 13px;
}

input:focus,
select:focus {
    border-color: #2563eb;
    box-shadow:
        0 0 0 2px rgba(37, 99, 235, .08);
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    min-height: 58px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px 14px;

    background: #fff;

    border-bottom:
        1px solid #dfe3e8;

    flex-wrap: wrap;
}

.toolbar-spacer {
    flex: 1;
}

.search {
    width: 190px;
}

.counter {
    color: #7a8088;
    font-size: 12px;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    flex: 1;

    overflow-y: auto;

    padding: 16px;
}

.pset-container {
    max-width: 1500px;

    margin: 0 auto;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state {
    padding: 60px 20px;

    text-align: center;

    background: #fff;

    border:
        1px dashed #cfd4da;

    border-radius: 8px;

    color: #7b8189;

    font-size: 13px;
}


/* =========================================================
   PSET
========================================================= */

.pset {
    background: #fff;

    border:
        1px solid #d2d6dc;

    border-radius: 8px;

    margin-bottom: 12px;

    overflow: hidden;

    transition:
        box-shadow .15s,
        opacity .15s;
}

.pset.dragging {
    opacity: .45;

    box-shadow:
        0 8px 24px rgba(0,0,0,.12);
}

.pset.drag-over {
    border-color: #2563eb;

    box-shadow:
        0 0 0 2px rgba(37,99,235,.12);
}


/* =========================================================
   PSET HEADER
========================================================= */

.pset-header {
    min-height: 52px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 8px;

    background: #f8f9fa;

    border-bottom:
        1px solid #e3e6ea;
}

.pset-name {
    flex: 1;
    min-width: 180px;
}

.ifc-class {
    flex: 1;
    min-width: 180px;
}

.mode {
    width: 58px;
}


/* =========================================================
   PSET DRAG HANDLE
========================================================= */

.pset-drag-handle {
    width: 28px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9aa0a6;

    cursor: grab;

    user-select: none;

    font-size: 17px;
}

.pset-drag-handle:active {
    cursor: grabbing;
}


/* =========================================================
   ICON BUTTON
========================================================= */

.icon-btn {
    width: 32px;
    min-width: 32px;
    height: 32px;

    padding: 0;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid transparent;

    background: transparent;

    color: #6b7280;

    border-radius: 5px;
}

.icon-btn:hover {
    background: #e9edf2;

    color: #1f2937;
}

.icon-btn.danger:hover {
    background: #feecec;

    color: #c62828;
}

.icon {
    width: 16px;
    height: 16px;

    display: block;
}


/* =========================================================
   PSET BODY
========================================================= */

.pset-body {
    padding: 10px;
}

.pset-actions {
    padding-top: 9px;
}


/* =========================================================
   PARAMETER HEADER
========================================================= */

.parameter-header {

    display: grid;

    grid-template-columns:
        28px
        minmax(180px, 1fr)
        120px
        minmax(180px, 1fr)
        34px
        34px;

    gap: 7px;

    padding:
        0 3px 5px 3px;

    color: #858b93;

    font-size: 11px;
}

.parameter-header .header-action {
    text-align: center;
}


/* =========================================================
   PARAMETERS
========================================================= */

.parameters {
    display: flex;

    flex-direction: column;

    gap: 5px;
}

.parameter {

    display: grid;

    grid-template-columns:
        28px
        minmax(180px, 1fr)
        120px
        minmax(180px, 1fr)
        34px
        34px;

    gap: 7px;

    align-items: center;

    padding: 3px;

    border-radius: 6px;

    transition:
        background .12s,
        box-shadow .12s,
        opacity .12s;
}

.parameter:hover {
    background: #f8f9fa;
}

.parameter.dragging {
    opacity: .35;
}

.parameter.drag-over {
    background: #edf4ff;

    box-shadow:
        inset 0 2px 0 #2563eb;
}


/* =========================================================
   PARAMETER DRAG HANDLE
========================================================= */

.parameter-drag-handle {

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #9ca3af;

    cursor: grab;

    user-select: none;

    font-size: 17px;
}

.parameter-drag-handle:hover {
    color: #4b5563;
}

.parameter-drag-handle:active {
    cursor: grabbing;
}


/* =========================================================
   NO PARAMETERS
========================================================= */

.no-params {
    color: #9aa0a6;

    font-size: 12px;

    padding: 8px 3px;
}


/* =========================================================
   FILE
========================================================= */

#importFile {
    display: none;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notification {

    position: fixed;

    right: 20px;
    bottom: 20px;

    background: #222;

    color: #fff;

    padding:
        11px 15px;

    border-radius: 7px;

    font-size: 13px;

    opacity: 0;

    transform:
        translateY(10px);

    pointer-events: none;

    transition:
        opacity .2s,
        transform .2s;

    z-index: 1000;
}

.notification.show {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .parameter-header {
        display: none;
    }

    .parameter {

        grid-template-columns:
            28px
            1fr
            110px
            1fr
            34px
            34px;
    }

    .pset-header {
        flex-wrap: wrap;
    }

    .pset-name,
    .ifc-class {
        min-width: 140px;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div class="toolbar">

        <button id="importBtn">
            Импорт маппинга
        </button>

        <button id="importIdsBtn">
            Импорт IDS
        </button>

        <button id="saveBtn">
            Сохранить маппинг
        </button>

        <button
            id="addPsetBtn"
            class="primary"
        >
            Создать Pset
        </button>

        <input
            id="searchPset"
            class="search"
            placeholder="Поиск Pset"
        >

        <input
            id="searchIfc"
            class="search"
            placeholder="Поиск IfcClass"
        >

        <div class="toolbar-spacer"></div>

        <span
            id="counter"
            class="counter"
        ></span>

    </div>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main class="content">

        <div
            id="psetContainer"
            class="pset-container"
        ></div>

    </main>

</div>


<input
    id="importFile"
    type="file"
    accept=".txt"
/>

<input
    id="importIdsFile"
    type="file"
    accept=".ids,.xml,text/xml,application/xml"
/>


<div
    id="notification"
    class="notification"
></div>



<script>

"use strict";


/* =========================================================
   SVG ICONS
========================================================= */

const ICONS = {

    copy: `
        <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <rect
                x="8"
                y="8"
                width="11"
                height="11"
                rx="2"
            />
            <path
                d="M16 8V6
                   a2 2 0 0 0-2-2H6
                   a2 2 0 0 0-2 2v8
                   a2 2 0 0 0 2 2h2"
            />
        </svg>
    `,

    trash: `
        <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M4 7h16"/>
            <path d="M10 11v6"/>
            <path d="M14 11v6"/>
            <path d="M6 7l1 13h10l1-13"/>
            <path d="M9 7V4h6v3"/>
        </svg>
    `,

    chevronDown: `
        <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <polyline points="6 9 12 15 18 9"/>
        </svg>
    `,

    chevronRight: `
        <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <polyline points="9 18 15 12 9 6"/>
        </svg>
    `

};


/* =========================================================
   STATE
========================================================= */

let psets = [];

let draggedPsetId = null;

let draggedParameter = null;


/* =========================================================
   DOM
========================================================= */

const psetContainer =
    document.getElementById(
        "psetContainer"
    );

const addPsetBtn =
    document.getElementById(
        "addPsetBtn"
    );

const importBtn =
    document.getElementById(
        "importBtn"
    );

const importIdsBtn =
    document.getElementById(
        "importIdsBtn"
    );

const importIdsFile =
    document.getElementById(
        "importIdsFile"
    );

const saveBtn =
    document.getElementById(
        "saveBtn"
    );

const importFile =
    document.getElementById(
        "importFile"
    );

const searchPset =
    document.getElementById(
        "searchPset"
    );

const searchIfc =
    document.getElementById(
        "searchIfc"
    );

const counter =
    document.getElementById(
        "counter"
    );


/* =========================================================
   UTILS
========================================================= */

function generateId(prefix) {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function notify(message) {

    const element =
        document.getElementById(
            "notification"
        );

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    setTimeout(
        () => {
            element.classList.remove(
                "show"
            );
        },
        2000
    );
}


/* =========================================================
   CREATE PSET
========================================================= */

function createPset(data = {}) {

    const pset = {

        id:
            generateId("pset"),

        name:
            data.name || "",

        mode:
            data.mode || "I",

        ifcClass:
            data.ifcClass || "",

        expanded:
            data.expanded !== undefined
                ? data.expanded
                : true,

        parameters: []

    };


    if (
        Array.isArray(
            data.parameters
        )
    ) {

        data.parameters.forEach(
            parameter => {

                pset.parameters.push({

                    id:
                        generateId("param"),

                    ifcProperty:
                        parameter.ifcProperty || "",

                    type:
                        parameter.type || "Text",

                    revitParameter:
                        parameter.revitParameter || ""

                });

            }
        );

    }


    psets.push(pset);

    render();

    return pset;
}


/* =========================================================
   DELETE PSET
========================================================= */

function deletePset(id) {

    const index =
        psets.findIndex(
            p => p.id === id
        );

    if (index === -1)
        return;

    psets.splice(
        index,
        1
    );

    render();

    notify(
        "Pset удалён"
    );
}


/* =========================================================
   COPY PSET
========================================================= */

function copyPset(id) {

    const source =
        psets.find(
            p => p.id === id
        );

    if (!source)
        return;


    const copy = {

        name:
            source.name,

        mode:
            source.mode,

        ifcClass:
            source.ifcClass,

        expanded:
            true,

        parameters:
            source.parameters.map(
                parameter => ({

                    ifcProperty:
                        parameter.ifcProperty,

                    type:
                        parameter.type,

                    revitParameter:
                        parameter.revitParameter

                })
            )

    };


    createPset(copy);

    notify(
        "Pset скопирован"
    );
}


/* =========================================================
   ADD PARAMETER
========================================================= */

function addParameter(
    psetId
) {

    const pset =
        psets.find(
            p => p.id === psetId
        );

    if (!pset)
        return;


    pset.parameters.push({

        id:
            generateId("param"),

        ifcProperty: "",

        type: "Text",

        revitParameter: ""

    });


    render();
}


/* =========================================================
   DELETE PARAMETER
========================================================= */

function deleteParameter(
    psetId,
    parameterId
) {

    const pset =
        psets.find(
            p => p.id === psetId
        );

    if (!pset)
        return;


    const index =
        pset.parameters.findIndex(
            p =>
                p.id === parameterId
        );

    if (index === -1)
        return;


    pset.parameters.splice(
        index,
        1
    );

    render();
}


/* =========================================================
   COPY PARAMETER
========================================================= */

function copyParameter(
    psetId,
    parameterId
) {

    const pset =
        psets.find(
            p => p.id === psetId
        );

    if (!pset)
        return;


    const index =
        pset.parameters.findIndex(
            p =>
                p.id === parameterId
        );

    if (index === -1)
        return;


    const source =
        pset.parameters[index];


    pset.parameters.splice(

        index + 1,

        0,

        {

            id:
                generateId("param"),

            ifcProperty:
                source.ifcProperty,

            type:
                source.type,

            revitParameter:
                source.revitParameter

        }

    );


    render();

    notify(
        "Параметр скопирован"
    );
}


/* =========================================================
   UPDATE PSET
========================================================= */

function updatePset(
    id,
    field,
    value
) {

    const pset =
        psets.find(
            p => p.id === id
        );

    if (!pset)
        return;

    pset[field] =
        value;

    updateCounters();
}


/* =========================================================
   UPDATE PARAMETER
========================================================= */

function updateParameter(
    psetId,
    parameterId,
    field,
    value
) {

    const pset =
        psets.find(
            p => p.id === psetId
        );

    if (!pset)
        return;


    const parameter =
        pset.parameters.find(
            p =>
                p.id === parameterId
        );

    if (!parameter)
        return;


    parameter[field] =
        value;
}


/* =========================================================
   TOGGLE PSET
========================================================= */

function togglePset(id) {

    const pset =
        psets.find(
            p => p.id === id
        );

    if (!pset)
        return;


    pset.expanded =
        !pset.expanded;


    render();
}


/* =========================================================
   FILTER
========================================================= */

function getFilteredPsets() {

    const psetQuery =
        searchPset.value
            .trim()
            .toLowerCase();

    const ifcQuery =
        searchIfc.value
            .trim()
            .toLowerCase();


    return psets.filter(
        pset => {

            const matchesPset =
                !psetQuery ||
                pset.name
                    .toLowerCase()
                    .includes(
                        psetQuery
                    );


            const matchesIfc =
                !ifcQuery ||
                pset.ifcClass
                    .toLowerCase()
                    .includes(
                        ifcQuery
                    );


            return (
                matchesPset &&
                matchesIfc
            );

        }
    );
}


/* =========================================================
   PARAMETER DRAG START
========================================================= */

function parameterDragStart(
    event,
    psetId,
    parameterId
) {

    draggedParameter = {

        psetId:
            psetId,

        parameterId:
            parameterId

    };


    event.currentTarget
        .classList
        .add("dragging");


    event.dataTransfer.effectAllowed =
        "move";


    event.dataTransfer.setData(
        "text/plain",
        parameterId
    );
}


/* =========================================================
   PARAMETER DRAG END
========================================================= */

function parameterDragEnd(event) {

    event.currentTarget
        .classList
        .remove("dragging");


    document
        .querySelectorAll(
            ".parameter.drag-over"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "drag-over"
                )
        );


    draggedParameter =
        null;
}


/* =========================================================
   PARAMETER DRAG OVER
========================================================= */

function parameterDragOver(event) {

    event.preventDefault();

    event.dataTransfer.dropEffect =
        "move";

    const row =
        event.currentTarget;

    if (
        !draggedParameter
    )
        return;


    row.classList.add(
        "drag-over"
    );
}


/* =========================================================
   PARAMETER DRAG LEAVE
========================================================= */

function parameterDragLeave(event) {

    event.currentTarget
        .classList
        .remove(
            "drag-over"
        );
}


/* =========================================================
   PARAMETER DROP
========================================================= */

function parameterDrop(
    event,
    targetPsetId,
    targetParameterId
) {

    event.preventDefault();

    event.currentTarget
        .classList
        .remove(
            "drag-over"
        );


    if (!draggedParameter)
        return;


    if (
        draggedParameter.psetId !==
        targetPsetId
    )
        return;


    const pset =
        psets.find(
            p =>
                p.id ===
                targetPsetId
        );


    if (!pset)
        return;


    const fromIndex =
        pset.parameters.findIndex(
            p =>
                p.id ===
                draggedParameter.parameterId
        );


    const toIndex =
        pset.parameters.findIndex(
            p =>
                p.id ===
                targetParameterId
        );


    if (
        fromIndex === -1 ||
        toIndex === -1 ||
        fromIndex === toIndex
    )
        return;


    const moved =
        pset.parameters.splice(
            fromIndex,
            1
        )[0];


    pset.parameters.splice(
        toIndex,
        0,
        moved
    );


    draggedParameter =
        null;


    render();
}


/* =========================================================
   PSET DRAG
========================================================= */

function psetDragStart(
    event,
    psetId
) {

    draggedPsetId =
        psetId;


    event.currentTarget
        .classList
        .add("dragging");


    event.dataTransfer.effectAllowed =
        "move";

    event.dataTransfer.setData(
        "text/plain",
        psetId
    );
}


function psetDragEnd(event) {

    event.currentTarget
        .classList
        .remove(
            "dragging"
        );


    document
        .querySelectorAll(
            ".pset.drag-over"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "drag-over"
                )
        );


    draggedPsetId =
        null;
}


function psetDragOver(event) {

    event.preventDefault();

    if (!draggedPsetId)
        return;


    event.dataTransfer.dropEffect =
        "move";


    event.currentTarget
        .classList
        .add(
            "drag-over"
        );
}


function psetDragLeave(event) {

    event.currentTarget
        .classList
        .remove(
            "drag-over"
        );
}


function psetDrop(
    event,
    targetPsetId
) {

    event.preventDefault();

    event.currentTarget
        .classList
        .remove(
            "drag-over"
        );


    if (
        !draggedPsetId ||
        draggedPsetId ===
        targetPsetId
    )
        return;


    const fromIndex =
        psets.findIndex(
            p =>
                p.id ===
                draggedPsetId
        );


    const toIndex =
        psets.findIndex(
            p =>
                p.id ===
                targetPsetId
        );


    if (
        fromIndex === -1 ||
        toIndex === -1
    )
        return;


    const moved =
        psets.splice(
            fromIndex,
            1
        )[0];


    psets.splice(
        toIndex,
        0,
        moved
    );


    draggedPsetId =
        null;


    render();
}


/* =========================================================
   RENDER PARAMETER
========================================================= */

function renderParameter(
    pset,
    parameter
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "parameter";


    row.draggable =
        true;


    row.innerHTML = `

        <div
            class="parameter-drag-handle"
            title="Перетащить"
        >
            ⠿
        </div>

        <input
            type="text"
            placeholder="IFC Property"
            value="${escapeHtml(
                parameter.ifcProperty
            )}"
            data-field="ifcProperty"
        >

        <select
            data-field="type"
        >

            <option value="Text">
                Text
            </option>

            <option value="Real">
                Real
            </option>

            <option value="Integer">
                Integer
            </option>

            <option value="Boolean">
                Boolean
            </option>

            <option value="Lenght">
                Lenght
            </option>

            <option value="Area">
                Area
            </option>

        </select>

        <input
            type="text"
            placeholder="Revit Parameter"
            value="${escapeHtml(
                parameter.revitParameter
            )}"
            data-field="revitParameter"
        >

        <button
            class="icon-btn"
            title="Копировать"
            data-action="copy"
        >
            ${ICONS.copy}
        </button>

        <button
            class="icon-btn danger"
            title="Удалить"
            data-action="delete"
        >
            ${ICONS.trash}
        </button>

    `;


    const select =
        row.querySelector(
            "select"
        );


    select.value =
        parameter.type;


    /* INPUTS */

    row.querySelectorAll(
        "input, select"
    ).forEach(
        element => {

            element.addEventListener(
                "input",
                () => {

                    updateParameter(
                        pset.id,
                        parameter.id,
                        element.dataset.field,
                        element.value
                    );

                    updateCounters();

                }
            );


            element.addEventListener(
                "change",
                () => {

                    updateParameter(
                        pset.id,
                        parameter.id,
                        element.dataset.field,
                        element.value
                    );

                    updateCounters();

                }
            );

        }
    );


    /* COPY */

    row.querySelector(
        '[data-action="copy"]'
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            copyParameter(
                pset.id,
                parameter.id
            );

        }
    );


    /* DELETE */

    row.querySelector(
        '[data-action="delete"]'
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            deleteParameter(
                pset.id,
                parameter.id
            );

        }
    );


    /* DRAG */

    row.addEventListener(
        "dragstart",
        event =>
            parameterDragStart(
                event,
                pset.id,
                parameter.id
            )
    );


    row.addEventListener(
        "dragend",
        parameterDragEnd
    );


    row.addEventListener(
        "dragover",
        parameterDragOver
    );


    row.addEventListener(
        "dragleave",
        parameterDragLeave
    );


    row.addEventListener(
        "drop",
        event =>
            parameterDrop(
                event,
                pset.id,
                parameter.id
            )
    );


    return row;
}

    ) {

            document.createElement(
                "div"
            );


        empty.className =
            "empty-state";


        if (
            psets.length === 0
        ) {

            empty.innerHTML =
                `
                Нет Pset.<br><br>
                Нажмите «Создать Pset»
                или импортируйте существующий маппинг.
                `;

        } else {

            empty.textContent =
                "По заданному фильтру Pset не найдены.";

        psetContainer.appendChild(
            empty
        );


    } else {

        filtered.forEach(

                );

        );

    updateCounters();

}

/* =========================================================
   IMPORT PARSER
========================================================= */

function importMappingText(
    text
) {

    psets = [];


    let currentPset =
        null;


    const lines =
        text.split(
            /\r?\n/
        );


    lines.forEach(
        line => {

            if (!line)
                return;


            const parts =
                line.split(
                    "\t"
                );


            if (
                parts[0] ===
                "PropertySet:"
            ) {

                currentPset =
                    createPset({

                        name:
                            parts[1] || "",

                        mode:
                            parts[2] || "I",

                        ifcClass:
                            parts[3] || "",

                        expanded:
                            true

                    });


            } else {

                if (!currentPset)
                    return;


                currentPset.parameters.push({

                    id:
                        generateId(
                            "param"
                        ),

                    ifcProperty:
                        parts[1] || "",

                    type:
                        parts[2] || "Text",

                    revitParameter:
                        parts[3] || ""

                });

            }

        }
    );


    render();
}



/* =========================================================
   IDS IMPORT
========================================================= */

/*
    IDS -> preliminary mapping

    What is extracted from IDS:
      - IFC class: applicability/entity/@name
      - PropertySet: requirements/propertySet/@name
      - IFC property: requirements/propertySet/property/@name
      - IFC datatype: property/@datatype

    The result is converted into the editor's native structure:
      {
          name: "Pset_...",
          ifcClass: "IfcWall",
          parameters: [
              {
                  ifcProperty: "Reference",
                  type: "Text",
                  revitParameter: "Reference"
              }
          ]
      }

    IDS uses XML namespaces, so selectors are intentionally
    namespace-independent (local-name()).
*/

function xmlLocalName(element) {
    return element && element.localName
        ? element.localName
        : String(element && element.nodeName || "")
            .split(":")
            .pop();
}

function getDirectChildren(element, localName) {
    if (!element) return [];

    return Array.from(element.children || [])
        .filter(child => xmlLocalName(child) === localName);
}

function getDescendants(element, localName) {
    if (!element) return [];

    return Array.from(element.getElementsByTagName("*"))
        .filter(node => xmlLocalName(node) === localName);
}

function getFirstDirectChild(element, localName) {
    return getDirectChildren(element, localName)[0] || null;
}

function getAttributeIgnoreCase(element, names) {
    if (!element) return "";

    for (const name of names) {
        const direct = element.getAttribute(name);
        if (direct !== null && String(direct).trim() !== "") {
            return String(direct).trim();
        }
    }

    const attrs = Array.from(element.attributes || []);

    for (const wanted of names) {
        const found = attrs.find(
            attr =>
                String(attr.name).toLowerCase() ===
                String(wanted).toLowerCase()
        );

        if (
            found &&
            String(found.value).trim() !== ""
        ) {
            return String(found.value).trim();
        }
    }

    return "";
}

function normalizeIfcClass(value) {
    if (!value) return "";

    let result = String(value).trim();

    // IDS normally stores e.g. "IfcWall".
    // Keep the original value, but remove XML-ish whitespace.
    result = result.replace(/\s+/g, " ");

    return result;
}

function normalizeIfcType(value) {
    if (!value) return "Text";

    const raw = String(value)
        .trim()
        .toUpperCase()
        .replace(/^IFC/, "");

    /*
        IFC / IDS datatype -> editor datatype.

        Text:
          IfcText, IfcLabel, IfcIdentifier, IfcBoolean-like
          values are handled below explicitly.
        Real:
          IfcReal, IfcPositiveRatioMeasure, IfcRatioMeasure, etc.
        Integer:
          IfcInteger, IfcCountMeasure
        Length:
          IfcLengthMeasure
        Area:
          IfcAreaMeasure
        Boolean:
          IfcBoolean
    */

    if (
        raw === "BOOLEAN" ||
        raw === "LOGICAL"
    ) {
        return "Boolean";
    }

    if (
        raw === "INTEGER" ||
        raw === "COUNTMEASURE"
    ) {
        return "Integer";
    }

    if (
        raw === "LENGTHMEASURE" ||
        raw === "POSITIVELENGTHMEASURE" ||
        raw === "NONNEGATIVELENGTHMEASURE"
    ) {
        return "Lenght";
    }

    if (
        raw === "AREAMEASURE" ||
        raw === "POSITIVEAREAMEASURE" ||
        raw === "NONNEGATIVEAREAMEASURE"
    ) {
        return "Area";
    }

    if (
        raw === "REAL" ||
        raw === "NUMBER" ||
        raw === "RATIOMEASURE" ||
        raw === "POSITIVERATIOMEASURE" ||
        raw === "NONNEGATIVERATIOMEASURE" ||
        raw === "PLANEANGLEMEASURE" ||
        raw === "SOLIDANGLEMEASURE"
    ) {
        return "Real";
    }

    // Common textual IFC types.
    if (
        raw === "TEXT" ||
        raw === "LABEL" ||
        raw === "IDENTIFIER" ||
        raw === "DESCRIPTION" ||
        raw === "URI" ||
        raw === "DATE" ||
        raw === "DATETIME" ||
        raw === "TIME"
    ) {
        return "Text";
    }

    // Measure types that are not represented by a dedicated
    // type in the current editor are kept as Real.
    if (
        raw.endsWith("MEASURE") ||
        raw.endsWith("RATIO")
    ) {
        return "Real";
    }

    return "Text";
}

function getIdsSimpleValue(element) {
    if (!element) return "";

    // IDS uses <simpleValue> inside many constraint/value elements.
    const simpleValue = getFirstDirectChild(element, "simpleValue");
    if (simpleValue) {
        return String(simpleValue.textContent || "").trim();
    }

    // Be tolerant of exporters that put the value directly in the element.
    return String(element.textContent || "").trim();
}

function readIdsEntityClasses(applicability) {
    if (!applicability) return [];

    const entities = getDirectChildren(applicability, "entity");
    const classes = [];

    entities.forEach(entity => {
        const nameElement = getFirstDirectChild(entity, "name");
        let value = "";

        if (nameElement) {
            value = getIdsSimpleValue(nameElement);
        }

        // Tolerate exporters using <entity name="IfcWall">.
        if (!value) {
            value = getAttributeIgnoreCase(entity, ["name"]);
        }

        value = normalizeIfcClass(value);

        if (value && !classes.includes(value)) {
            classes.push(value);
        }
    });

    return classes;
}

function readIdsProperty(propertyElement) {
    if (!propertyElement) return null;

    // IDS 1.0/1.1 structure:
    // <property dataType="IFCREAL" cardinality="optional">
    //   <propertySet><simpleValue>RusSet_AGR</simpleValue></propertySet>
    //   <baseName><simpleValue>RUS_AreaSquare</simpleValue></baseName>
    // </property>
    const dataType = getAttributeIgnoreCase(
        propertyElement,
        ["dataType", "datatype", "type"]
    );

    const propertySetElement = getFirstDirectChild(
        propertyElement,
        "propertySet"
    );

    const baseNameElement = getFirstDirectChild(
        propertyElement,
        "baseName"
    );

    let propertySet = propertySetElement
        ? getIdsSimpleValue(propertySetElement)
        : "";

    let baseName = baseNameElement
        ? getIdsSimpleValue(baseNameElement)
        : "";

    // Tolerate non-standard/simple exporter variants.
    if (!baseName) {
        baseName = getAttributeIgnoreCase(
            propertyElement,
            ["name", "baseName"]
        );
    }

    if (!propertySet) {
        propertySet = getAttributeIgnoreCase(
            propertyElement,
            ["propertySet", "pset"]
        );
    }

    if (!baseName || !propertySet) {
        return null;
    }

    return {
        psetName: propertySet.trim(),
        name: baseName.trim(),
        type: normalizeIfcType(dataType),
        rawType: String(dataType || "").trim()
    };
}

function readIdsSpecification(specification) {
    const result = [];

    const applicability = getFirstDirectChild(
        specification,
        "applicability"
    );

    const ifcClasses = readIdsEntityClasses(applicability);

    const requirements = getFirstDirectChild(
        specification,
        "requirements"
    );

    if (!requirements) return result;

    // In a valid IDS file, properties are direct children of requirements.
    // We intentionally do NOT search for <propertySet> here because in IDS
    // the propertySet is a child of <property>, not a container.
    const properties = getDirectChildren(
        requirements,
        "property"
    );

    properties.forEach(propertyElement => {
        const property = readIdsProperty(propertyElement);
        if (!property) return;

        // A specification can contain several entity constraints.
        // Create a record for each applicable IFC class.
        if (ifcClasses.length) {
            ifcClasses.forEach(ifcClass => {
                result.push({
                    ifcClass,
                    psetName: property.psetName,
                    ifcProperty: property.name,
                    type: property.type,
                    rawType: property.rawType
                });
            });
        } else {
            // Keep the property even if the exporter omitted entity
            // applicability. The UI can then show an empty IFC class.
            result.push({
                ifcClass: "",
                psetName: property.psetName,
                ifcProperty: property.name,
                type: property.type,
                rawType: property.rawType
            });
        }
    });

    return result;
}

function parseIdsXml(text) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "application/xml");

    const parserError = xml.getElementsByTagName("parsererror");
    if (parserError && parserError.length) {
        throw new Error("Файл IDS/XML содержит некорректный XML.");
    }

    const root = xml.documentElement;
    if (!root) {
        throw new Error("Не найден корневой XML-элемент.");
    }

    // Namespace-independent IDS parsing. For example:
    // <ids:ids> ... <ids:specifications> ... <ids:specification> ...
    // The ids: prefix is irrelevant; xmlLocalName() returns the local name.
    if (xmlLocalName(root) !== "ids") {
        throw new Error("Это не IDS-файл: корневой элемент <ids:ids> не найден.");
    }

    const specificationsContainer = getFirstDirectChild(
        root,
        "specifications"
    );

    if (!specificationsContainer) {
        throw new Error("В IDS не найден раздел <specifications>.");
    }

    const specifications = getDirectChildren(
        specificationsContainer,
        "specification"
    );

    if (!specifications.length) {
        throw new Error("В IDS не найдены элементы <specification>.");
    }

    const records = [];

    specifications.forEach(specification => {
        const items = readIdsSpecification(specification);
        records.push(...items);
    });

    if (!records.length) {
        throw new Error(
            "IDS прочитан, но в requirements не найдено ни одного свойства с propertySet и baseName."
        );
    }

    return records;
}

function idsRecordsToPsets(records) {

    /*
        Key = IFC class + PropertySet.

        This means two IDS specifications using
        the same Pset for the same IFC class will be
        combined into one editor Pset.
    */

    const map = new Map();

    records.forEach(
        record => {

            const psetName =
                String(record.psetName || "").trim();

            const ifcClass =
                normalizeIfcClass(
                    record.ifcClass
                );

            const propertyName =
                String(
                    record.ifcProperty || ""
                ).trim();

            if (
                !psetName ||
                !propertyName
            ) {
                return;
            }

            const key =
                ifcClass +
                "||" +
                psetName;

            if (!map.has(key)) {

                map.set(
                    key,
                    {
                        name: psetName,
                        mode: "I",
                        ifcClass,
                        expanded: true,
                        parameters: []
                    }
                );
            }

            const target =
                map.get(key);

            const alreadyExists =
                target.parameters.some(
                    parameter =>
                        parameter.ifcProperty
                            .trim()
                            .toLowerCase() ===
                        propertyName
                            .toLowerCase()
                );

            if (alreadyExists) {
                return;
            }

            target.parameters.push({
                ifcProperty: propertyName,
                type:
                    record.type || "Text",

                // IDS describes IFC requirements, not Revit parameters.
                // Therefore the Revit field must remain empty until the
                // user explicitly maps it to an FOP parameter.
                revitParameter: ""
            });
        }
    );

    return Array.from(
        map.values()
    );
}

function importIdsText(text) {

    const records =
        parseIdsXml(text);

    if (!records.length) {
        throw new Error(
            "В IDS не найдены пары IFC class / PropertySet / Property."
        );
    }

    const importedPsets =
        idsRecordsToPsets(records);

    if (!importedPsets.length) {
        throw new Error(
            "Не удалось сформировать предварительный маппинг из IDS."
        );
    }

    /*
        IDS is treated as a source for a preliminary mapping.
        Existing Psets are not deleted.

        If an existing Pset with the same:
          IFC class + Pset name
        exists, missing properties are added to it.

        This is safer than replacing the whole current mapping.
    */

    let addedPsets = 0;
    let addedParameters = 0;

    importedPsets.forEach(
        imported => {

            let target =
                psets.find(
                    p =>
                        p.name.trim().toLowerCase() ===
                            imported.name.trim().toLowerCase() &&
                        p.ifcClass.trim().toLowerCase() ===
                            imported.ifcClass.trim().toLowerCase()
                );

            if (!target) {

                target =
                    createPset({
                        name: imported.name,
                        mode: imported.mode,
                        ifcClass: imported.ifcClass,
                        expanded: true,
                        parameters: []
                    });

                addedPsets++;
            }

            imported.parameters.forEach(
                importedParameter => {

                    const exists =
                        target.parameters.some(
                            parameter =>
                                parameter.ifcProperty
                                    .trim()
                                    .toLowerCase() ===
                                importedParameter.ifcProperty
                                    .trim()
                                    .toLowerCase()
                        );

                    if (exists) return;

                    target.parameters.push({
                        id:
                            generateId("param"),

                        ifcProperty:
                            importedParameter.ifcProperty,

                        type:
                            importedParameter.type,

                        revitParameter:
                            importedParameter.revitParameter
                    });

                    addedParameters++;
                }
            );
        }
    );

    render();

    notify(
        `IDS импортирован: ${importedPsets.length} Pset, ` +
        `${records.length} свойств`
    );

    return {
        specifications: importedPsets.length,
        records: records.length,
        addedPsets,
        addedParameters
    };
}

/* =========================================================
   IMPORT IDS BUTTON
========================================================= */

importIdsBtn.addEventListener(
    "click",
    () => {

        importIdsFile.value = "";
        importIdsFile.click();

    }
);

importIdsFile.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                try {

                    const result =
                        importIdsText(
                            event.target.result
                        );

                    notify(
                        `IDS: добавлено Pset — ` +
                        `${result.addedPsets}, ` +
                        `параметров — ` +
                        `${result.addedParameters}`
                    );

                } catch (error) {

                    console.error(error);

                    alert(
                        "Ошибка импорта IDS:\n\n" +
                        error.message
                    );
                }
            };

        reader.readAsText(
            file,
            "UTF-8"
        );
    }
);

/* =========================================================
   SAVE
========================================================= */

saveBtn.addEventListener(
    "click",
    saveMapping
);


function saveMapping() {

    const duplicates =
        new Set();


    for (
        const pset of psets
    ) {

        const name =
            pset.name.trim();


        const ifcClass =
            pset.ifcClass.trim();


        if (!name) {

            alert(
                "Ошибка:\n\n" +
                "Имя PropertySet пустое."
            );

            return;
        }


        const key =
            name +
            "||" +
            ifcClass;


        if (
            duplicates.has(
                key
            )
        ) {

            alert(
                "Ошибка:\n\n" +
                "Дубликат PropertySet:\n" +
                name +
                " | " +
                ifcClass
            );

            return;
        }


        duplicates.add(
            key
        );

    }


    const lines = [];


    psets.forEach(
        pset => {

            lines.push(
                [
                    "PropertySet:",
                    pset.name,
                    pset.mode,
                    pset.ifcClass,
                    "",
                    "",
                    "",
                    ""
                ].join("\t")
            );


            pset.parameters.forEach(
                parameter => {

                    lines.push(
                        [
                            "",
                            parameter.ifcProperty,
                            parameter.type,
                            parameter.revitParameter,
                            "",
                            "",
                            "",
                            ""
                        ].join("\t")
                    );

                }
            );

        }
    );


    const text =
        lines.join(
            "\n"
        );


    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "mapping.txt";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    notify(
        "Маппинг сохранён"
    );
}


/* =========================================================
   INITIAL
========================================================= */

render();

</script>
